<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; }
        main { flex: 1; }
        .carrito-container { max-width: 800px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .tabla-carrito { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .tabla-carrito th, .tabla-carrito td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .tabla-carrito th { background-color: #f8f8f8; color: #333; }
        .img-carrito { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; background-color: #e0e0e0; display: inline-block; }
        .acciones-carrito { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .total-contenedor { text-align: right; font-size: 1.1rem; color: #333; margin-top: 10px; line-height: 1.8; }
        .total-precio { color: #ce1126; font-size: 1.4rem; font-weight: bold; }
        .btn-eliminar { background: none; border: none; color: #ce1126; cursor: pointer; font-size: 1.1rem; }
        .carrito-vacio { text-align: center; padding: 40px; font-size: 1.2rem; color: #777; }
        .input-cantidad { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

    <div id="banner-global"></div>
    <header></header>

<main class="seccion">
    <div class="carrito-container">
        <h2>Tu Carrito de Compras</h2>
        <div id="contenido-carrito"></div>

        <div class="total-contenedor" id="contenedor-total" style="display: none;">
            <div>Subtotal: <span id="desglose-subtotal">$0.00</span></div>
            <div>IVA (16%): <span id="desglose-iva">$0.00</span></div>
            <div style="margin-top: 5px; font-weight: bold;">
                Total a Pagar: <span id="total-pagar" class="total-precio">$0.00</span>
            </div>
        </div>

        <div class="acciones-carrito">
            <a href="catalogo.html" style="background: #666; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">Seguir Comprando</a>
            <div id="botones-pago" style="display: none; gap: 10px;">
                <button style="background: #f0ad4e; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px;" onclick="vaciarCarrito()">Vaciar Carrito</button>
                <button style="background: #00843D; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px;" onclick="procesarPago()">Proceder al Pago</button>
            </div>
        </div>
    </div>
</main>

<footer></footer>
<script src="componentes.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.addEventListener('DOMContentLoaded', renderizarCarrito);

    function renderizarCarrito() {
        let carrito = JSON.parse(localStorage.getItem('carritoApp')) || [];
        const contenedor = document.getElementById('contenido-carrito');
        const contenedorTotal = document.getElementById('contenedor-total');
        const botonesPago = document.getElementById('botones-pago');

        if (carrito.length === 0) {
            contenedor.innerHTML = '<div class="carrito-vacio">Tu carrito está vacío. ¡Ve a disfrutar de nuestros platillos!</div>';
            contenedorTotal.style.display = 'none';
            botonesPago.style.display = 'none';
            actualizarContadorMenu(carrito);
            return;
        }

        let sumaProductos = 0;
        let tablaHTML = `<table class="tabla-carrito"><thead><tr><th>Platillo</th><th>Nombre</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead><tbody>`;

        carrito.forEach((item, index) => {
            let precio = parseFloat(item.precio) || 0;
            let cantidad = parseInt(item.cantidad) || 1;
            let subtotalItem = precio * cantidad;
            sumaProductos += subtotalItem;
            
            let nombreMostrar = item.titulo || item.nombre || "Producto";
            let imagenMostrar = item.img || item.foto || "";

            tablaHTML += `<tr>
                <td><img src="${imagenMostrar}" class="img-carrito" onerror="this.src='img/logo.png.png'"></td>
                <td><strong>${nombreMostrar}</strong></td>
                <td>$${precio.toFixed(2)}</td>
                <td><input type="number" class="input-cantidad" value="${cantidad}" min="1" onchange="cambiarCantidad(${index}, this.value)"></td>
                <td>$${subtotalItem.toFixed(2)}</td>
                <td><button class="btn-eliminar" onclick="eliminarProducto(${index})"><i class="fa-solid fa-trash-can"></i></button></td>
            </tr>`;
        });

        tablaHTML += `</tbody></table>`;
        contenedor.innerHTML = tablaHTML;

        let subtotalNeto = sumaProductos / 1.16;
        let ivaCalculado = sumaProductos - subtotalNeto;

        document.getElementById('desglose-subtotal').innerText = `$${subtotalNeto.toFixed(2)}`;
        document.getElementById('desglose-iva').innerText = `$${ivaCalculado.toFixed(2)}`;
        document.getElementById('total-pagar').innerText = `$${sumaProductos.toFixed(2)}`;
        
        contenedorTotal.style.display = 'block';
        botonesPago.style.display = 'flex';
        actualizarContadorMenu(carrito);
    }

    function cambiarCantidad(index, nuevaCantidad) {
        let carrito = JSON.parse(localStorage.getItem('carritoApp')) || [];
        carrito[index].cantidad = parseInt(nuevaCantidad) || 1;
        localStorage.setItem('carritoApp', JSON.stringify(carrito));
        renderizarCarrito();
    }

    function eliminarProducto(index) {
        let carrito = JSON.parse(localStorage.getItem('carritoApp')) || [];
        carrito.splice(index, 1);
        localStorage.setItem('carritoApp', JSON.stringify(carrito));
        renderizarCarrito();
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Producto eliminado', showConfirmButton: false, timer: 2000 });
    }

    function vaciarCarrito() {
        localStorage.removeItem('carritoApp');
        renderizarCarrito();
    }

    function actualizarContadorMenu(carrito) {
        const contador = document.getElementById('cart-count');
        if (contador) {
            let totalItems = carrito.reduce((acc, item) => acc + (parseInt(item.cantidad) || 1), 0);
            contador.textContent = totalItems;
        }
    }

    function procesarPago() {
        window.location.href = 'pago.html';
    }
</script>

</body>
</html>
