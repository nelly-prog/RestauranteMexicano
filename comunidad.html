<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sabor Mexicano - Comunidad</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f8fa; }
        .contenedor-comunidad { width: 100%; max-width: 1400px; margin: 30px auto; padding: 0 20px; box-sizing: border-box; min-height: 70vh; }
        .pestanas-comunidad { display: flex; background: #f0ede5; padding: 6px; border-radius: 8px; margin: 0 auto 30px auto; max-width: 500px; justify-content: center; gap: 10px; }
        .btn-pestana { background: none; border: none; padding: 10px 20px; font-size: 0.95rem; font-weight: bold; color: #555; cursor: pointer; border-radius: 6px; transition: 0.3s; }
        .btn-pestana.activa { background: #006847; color: white; }
        .seccion-contenido { display: none; width: 100%; box-sizing: border-box; }
        .seccion-contenido.activa { display: block; }
        /* Muro Facebook */
        .muro-facebook-container { max-width: 750px; margin: 0 auto; }
        .crear-publicacion-card { background: white; border: 1px solid #e4e6eb; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .crear-header { display: flex; gap: 12px; margin-bottom: 12px; }
        .avatar-fijo { width: 40px; height: 40px; border-radius: 50%; background: #006847; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; }
        .input-simulado-fb { width: 100%; border: 1px solid #ccd0d5; border-radius: 20px; padding: 10px 16px; font-size: 0.95rem; outline: none; background-color: #f0f2f5; }
        .crear-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f2f3f5; padding-top: 12px; margin-top: 12px; }
        .input-nombre-fb { border: 1px solid #ccd0d5; border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; width: 180px; }
        /* Mensaje éxito */
        #mensaje-exito { display: none; background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; text-align: center; margin-top: 10px; font-weight: bold; border: 1px solid #c3e6cb; }
        .fb-post { background: white; border: 1px solid #e4e6eb; border-radius: 8px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 16px; }
        .fb-post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .fb-autor-info { display: flex; flex-direction: column; }
        .fb-nombre { font-weight: 600; color: #050505; text-decoration: none; font-size: 0.95rem; }
        .fb-tiempo { font-size: 0.75rem; color: #65676b; }
        .fb-texto { font-size: 0.95rem; color: #050505; line-height: 1.4; margin: 0 0 12px 0; white-space: pre-wrap; }
        .fb-contador-reacciones { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e4e6eb; font-size: 0.85rem; color: #65676b; margin-bottom: 8px; }
        .fb-acciones-bar { display: flex; border-bottom: 1px solid #e4e6eb; padding-bottom: 4px; margin-bottom: 10px; }
        .fb-btn-accion { flex: 1; background: none; border: none; padding: 8px; font-size: 0.9rem; color: #65676b; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .fb-btn-accion.like-activo { color: #1877f2; }
        /* Subasta */
        .contenedor-subasta { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: white; padding: 35px; border-radius: 12px; border: 1px solid #e4e6eb; }
        .subasta-info { display: flex; flex-direction: column; justify-content: center; }
        .temporizador { font-size: 1.6rem; color: #d32f2f; font-weight: bold; margin: 12px 0; }
        .btn-verde-accion { background-color: #006847; color: white; border: none; padding: 10px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        /* Mensaje de éxito para la subasta */
        #mensaje-subasta-exito { display: none; background: #d4edda; color: #155724; padding: 8px; border-radius: 6px; text-align: center; margin-top: 10px; font-weight: bold; border: 1px solid #c3e6cb; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="banner-global"></div>
    <header></header>

<main class="contenedor-comunidad">
    <div class="pestanas-comunidad">
        <button class="btn-pestana activa" onclick="cambiarPestana('comentarios')">💬 Muro de la Comunidad</button>
        <button class="btn-pestana" onclick="cambiarPestana('subasta')">🔨 Subasta Activa</button>
    </div>

    <section id="sec-comentarios" class="seccion-contenido activa">
        <div class="muro-facebook-container">
            <div class="crear-publicacion-card">
                <form onsubmit="crearPostPrincipal(event)">
                    <div class="crear-header">
                        <div class="avatar-fijo">U</div>
                        <input type="text" id="fb-input-texto" class="input-simulado-fb" placeholder="¿Qué estás pensando sobre nuestro menú o servicio?">
                    </div>
                    <div class="crear-footer">
                        <input type="text" id="fb-input-nombre" class="input-nombre-fb" placeholder="Tu Nombre o Usuario">
                        <button type="submit" class="btn-verde-accion">Publicar</button>
                    </div>
                    <div id="mensaje-exito">¡Publicado con éxito! 🎉</div>
                </form>
            </div>
            <div id="muro-posts-feed"></div>
        </div>
    </section>

    <section id="sec-subasta" class="seccion-contenido">
        <div class="contenedor-subasta">
            <div><img src="img/pozole.jpg" alt="Pozolera" style="width: 100%; border-radius: 8px;"></div>
            <div class="subasta-info">
                <h3>Pozolera de Barro Tradicional</h3>
                <div class="temporizador">⏱️ Cierra en: <span id="tiempo-reloj">00:49</span></div>
                <div style="font-weight: bold; margin-bottom: 15px;">Oferta actual: $<span id="oferta-maxima">450.00</span></div>
                
                <button class="btn-verde-accion" onclick="realizarOferta()">🔨 Ofertar</button>
                
                <div id="mensaje-subasta-exito">¡Oferta registrada con éxito! 🎉</div>
            </div>
        </div>
    </section>
</main>

<footer></footer>

<script>
    // Cambiamos la clave para forzar la carga de los 5 comentarios iniciales
    const CLAVE_MURO = 'fbMuroComunidad_v2';
    
    let posts = JSON.parse(localStorage.getItem(CLAVE_MURO)) || [
        { id: 1, autor: "Karly Cast", tiempo: "15 h", texto: "¡Las mejores enchiladas sin duda! El sazón es increíble.", likes: 12, liked: false },
        { id: 2, autor: "Alejandro Morales", tiempo: "1 día", texto: "El pozole de barro tradicional mantiene la comida caliente por más tiempo, excelente producto.", likes: 8, liked: false },
        { id: 3, autor: "Sofia R.", tiempo: "2 días", texto: "Me encantó el servicio a domicilio, llegó súper rápido y calientito.", likes: 5, liked: false },
        { id: 4, autor: "Carlos M.", tiempo: "3 días", texto: "¿Alguien sabe si habrá aguas frescas de sabor horchata este fin de semana?", likes: 3, liked: false },
        { id: 5, autor: "Mariana G.", tiempo: "4 días", texto: "¡100% recomendado! Definitivamente volveré a pedir muy pronto.", likes: 19, liked: false }
    ];

    function renderizarMuro() {
        const feed = document.getElementById('muro-posts-feed');
        feed.innerHTML = "";
        posts.forEach((post, index) => {
            const div = document.createElement('div');
            div.className = 'fb-post';
            div.innerHTML = `
                <div class="fb-post-header">
                    <div class="avatar-fijo">${post.autor.charAt(0).toUpperCase()}</div>
                    <div class="fb-autor-info"><span class="fb-nombre">${post.autor}</span><span class="fb-tiempo">${post.tiempo}</span></div>
                </div>
                <p class="fb-texto">${post.texto}</p>
                <div class="fb-contador-reacciones"><span>👍 ${post.likes} personas</span></div>
                <div class="fb-acciones-bar">
                    <button class="fb-btn-accion ${post.liked ? 'like-activo' : ''}" onclick="darLikePost(${index})">👍 Me gusta</button>
                </div>
            `;
            feed.appendChild(div);
        });
    }

    function darLikePost(index) {
        posts[index].liked = !posts[index].liked;
        posts[index].likes += posts[index].liked ? 1 : -1;
        localStorage.setItem(CLAVE_MURO, JSON.stringify(posts));
        renderizarMuro();
    }

    function crearPostPrincipal(event) {
        event.preventDefault();
        
        const nombreInput = document.getElementById('fb-input-nombre').value.trim();
        const textoInput = document.getElementById('fb-input-texto').value.trim();
        
        const autorFinal = nombreInput !== "" ? nombreInput : "Anónimo";
        const textoFinal = textoInput !== "" ? textoInput : "Sin comentarios";

        posts.unshift({ id: Date.now(), autor: autorFinal, tiempo: "Justo ahora", texto: textoFinal, likes: 0, liked: false });
        localStorage.setItem(CLAVE_MURO, JSON.stringify(posts));
        event.target.reset();
        renderizarMuro();
        const msg = document.getElementById('mensaje-exito');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
    }

    function cambiarPestana(idPestana) {
        document.querySelectorAll('.btn-pestana').forEach(btn => btn.classList.remove('activa'));
        document.querySelectorAll('.seccion-contenido').forEach(sec => sec.classList.remove('activa'));
        document.querySelector(`[onclick="cambiarPestana('${idPestana}')"]`).classList.add('activa');
        document.getElementById(`sec-${idPestana}`).classList.add('activa');
    }

    function realizarOferta() {
        const spanOferta = document.getElementById('oferta-maxima');
        let ofertaActual = parseFloat(spanOferta.innerText);
        let nuevaOferta = ofertaActual + 50.00;
        spanOferta.innerText = nuevaOferta.toFixed(2);

        const msgSubasta = document.getElementById('mensaje-subasta-exito');
        msgSubasta.style.display = 'block';
        
        setTimeout(() => {
            msgSubasta.style.display = 'none';
        }, 3000);
    }

    document.addEventListener('DOMContentLoaded', renderizarMuro);
</script>
<script src="componentes.js"></script>
</body>
</html>
