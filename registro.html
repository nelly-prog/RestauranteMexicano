<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <div class="logo-contenedor">
        <img src="img/logo.png.png" class="logo-img" alt="Logo">
        <span>Sabor Mexicano</span>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="login.html">Iniciar Sesión</a></li>
        </ul>
    </nav>
</header>

<main class="seccion">
    <h2>Crear Cuenta</h2>
    
    <form id="formRegistro">
        <label>Nombre:</label>
        <input type="text" id="nombreInput" required>
        
        <label>Correo:</label>
        <input type="email" id="emailInput" required>
        
        <label>Contraseña:</label>
        <input type="password" id="passwordInput" autocomplete="new-password" required>
        
        <div style="margin: 15px 0; display: flex; align-items: center;">
            <input type="checkbox" id="recordarPassword" name="recordar" checked>
            <label for="recordarPassword" style="margin-left: 8px; font-size: 0.9rem; color: #555;">
                Recordar mis datos en este equipo
            </label>
        </div>

        <button type="submit" class="btn-rojo">Registrarme</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 Sabor Mexicano - Todos los derechos reservados.</p>
    <p>Proyecto Integrador - Ingeniería en Software</p>
</footer>

<div id="modal-registro" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
    <div class="contenido-modal">
        <h3 style="color:#006847;">¡Registro exitoso!</h3>
        <p>Tu cuenta ha sido creada correctamente.</p>
        <button class="btn-rojo" onclick="guardarYRedirigir()">Aceptar</button>
    </div>
</div>

<div class="redes-flotantes">
    <a href="https://facebook.com" target="_blank">
        <img src="img/face.png" alt="Facebook">
    </a>
    <a href="https://instagram.com" target="_blank">
        <img src="img/insta.jpg" alt="Instagram">
    </a>
</div>

<script>
    // Evento para mostrar mi modal al registrarse
    document.getElementById('formRegistro').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('modal-registro').style.display = 'flex';
    });

    // Función para capturar los datos y mandarlos al perfil
    function guardarYRedirigir() {
        const nombre = document.getElementById('nombreInput').value;
        const email = document.getElementById('emailInput').value;
        const recordar = document.getElementById('recordarPassword').checked;
        
        localStorage.setItem('usuarioNombre', nombre);
        localStorage.setItem('usuarioEmail', email);
        localStorage.setItem('recordarSesion', recordar);
        
        window.location.href = "perfil.html";
    }
</script>

</body>
</html>
