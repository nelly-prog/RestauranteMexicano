<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* Estilos específicos para que el contenedor de registro sea una tarjeta elegante y centrada */
        .contenedor-tarjeta {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #006847; /* Borde verde característico */
        }
        
        .contenedor-tarjeta h2 {
            color: #006847;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        #formRegistro {
            max-width: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
        }

        #formRegistro label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            color: #005F73;
        }

        #formRegistro input { 
            display: block;
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            background-color: #fafafa;
            font-size: 1rem;
        }

        #formRegistro input:focus {
            outline: none;
            border-color: #006847;
            background-color: #ffffff;
        }

        .contenido-modal { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
            width: 80%; 
            max-width: 350px; 
        }

        .redes-flotantes { 
            position: fixed; 
            top: 50%; 
            right: 20px; 
            transform: translateY(-50%);
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 999; 
        }

        .redes-flotantes img { 
            width: 45px; 
            height: 45px;
        }
    </style>
</head>
<body>

<!-- BANNER Y HEADER AUTOMÁTICOS -->
<div id="banner-global"></div>
<header></header>

<main class="seccion">
    <div class="contenedor-tarjeta">
        <h2>Crear Cuenta</h2>
        
        <form id="formRegistro">
            <label>Nombre:</label>
            <input type="text" id="nombreInput" placeholder="Tu nombre">
            
            <label>Correo:</label>
            <input type="email" id="emailInput" placeholder="tu@correo.com">
            
            <label>Contraseña:</label>
            <input type="password" id="passwordInput" placeholder="••••••••">

            <button type="submit" class="btn-rojo" style="width: 100%; margin-top: 25px;">Registrarme</button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 0.95rem;">
            <p style="color: #555;">¿Ya tienes cuenta? <a href="login.html" style="color: #006847; font-weight: bold; text-decoration: none;">Inicia sesión aquí</a></p>
        </div>
    </div>
</main>

<!-- FOOTER AUTOMÁTICO -->
<footer></footer>

<div id="modal-registro" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
    <div class="contenido-modal">
        <h3 style="color:#006847; margin-bottom: 10px;">¡Registro exitoso!</h3>
        <p style="margin-bottom: 20px;">Bienvenido a Sabor Mexicano.</p>
        <button class="btn-rojo" onclick="guardarYRedirigir()" style="width: 100%;">Aceptar</button>
    </div>
</div>

<div class="redes-flotantes">
    <a href="https://facebook.com" target="_blank"><img src="img/face.png" alt="Facebook"></a>
    <a href="https://instagram.com" target="_blank"><img src="img/insta.jpg" alt="Instagram"></a>
</div>

<!-- SCRIPT DE COMPONENTES PARA CARGAR HEADER Y FOOTER -->
<script src="componentes.js"></script>

<script>
    document.getElementById('formRegistro').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('modal-registro').style.display = 'flex';
    });

    function guardarYRedirigir() {
        const nombreInput = document.getElementById('nombreInput').value.trim();
        const emailInput = document.getElementById('emailInput').value.trim();

        // Si están vacíos, asigna valores por defecto automáticamente
        const nombre = nombreInput !== "" ? nombreInput : "Usuario_Invitado";
        const email = emailInput !== "" ? emailInput : "invitado@sabormexicano.com";
        
        localStorage.setItem('usuarioNombre', nombre);
        localStorage.setItem('usuarioEmail', email);
        localStorage.setItem('usuario_activo', nombre);
        localStorage.setItem('sesionIniciada', 'true');
        
        window.location.href = "perfil.html";
    }
</script>

</body>
</html>
