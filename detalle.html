<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .contenido-legal {
            max-width: 650px; 
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .img-detalle-contenedor {
            width: 100%;
            max-width: 400px;
            height: 280px;    
            margin: 0 auto 20px auto; 
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .img-detalle {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .precio {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ce1126;
            margin: 10px 0;
        }

        #titulo-prod {
            font-size: 1.8rem;
            color: #333;
            margin-top: 10px;
        }

        .selector-cantidad {
            display: inline-flex;
            align-items: center;
            border: 2px solid #ddd;
            border-radius: 25px;
            padding: 2px;
            background: #f9f9f9;
        }

        .btn-cantidad {
            background: none;
            border: none;
            width: 35px;
            height: 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .btn-cantidad:hover {
            background: #e0e0e0;
        }

        .input-cantidad {
            width: 40px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            outline: none;
        }

        .input-cantidad::-webkit-inner-spin-button, 
        .input-cantidad::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .btn-carrito {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #ce1126;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        .btn-carrito:hover {
            background-color: #b71c1c;
        }

        .relacionados-seccion {
            max-width: 900px;
            margin: 50px auto 40px auto;
            text-align: left;
            padding: 0 20px;
        }

        .relacionados-titulo {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            border-left: 5px solid #ce1126;
            padding-left: 10px;
        }

        .relacionados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .tarjeta-relacionado {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .tarjeta-relacionado:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        .tarjeta-relacionado img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .tarjeta-relacionado-info {
            padding: 12px;
            text-align: center;
        }

        .tarjeta-relacionado-info h4 {
            margin: 0 0 5px 0;
            font-size: 1rem;
            color: #333;
        }

        .tarjeta-relacionado-info p {
            margin: 0;
            color: #ce1126;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* Estilo para la notificación Toast */
        .notificacion-toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10000;
            transition: bottom 0.4s ease-in-out;
            font-size: 0.95rem;
        }
        .notificacion-toast.mostrar {
            bottom: 30px;
        }
        .notificacion-toast i {
            color: #4caf50;
            font-size: 1.2rem;
        }
    </style>
    
    <!-- Script global de componentes para inyectar cabecera, pie, banner y cookies -->
    <script src="componentes.js" defer></script>
</head>
<body style="background-color: #fdfbf7;">

    <!-- Banner promocional superior inyectado -->
    <div id="banner-global"></div>

    <!-- Encabezado inyectado por componentes.js -->
    <header></header>

    <main class="seccion">
        <div class="contenido-legal" id="info-producto">
            <div class="img-detalle-contenedor">
                <img id="img-prod" src="" class="img-detalle" alt="Producto">
            </div>
            
            <h1 id="titulo-prod">Cargando...</h1>
            <p id="precio-prod" class="precio"></p>
            <p id="desc-prod" style="margin-bottom: 25px; color: #555; font-size: 1.1rem; line-height: 1.5;"></p>
            
            <div style="display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 25px;">
                <div class="selector-cantidad">
                    <button type="button" class="btn-cantidad" onclick="cambiarCantidad(-1)">-</button>
                    <input type="number" id="cantidad-prod" class="input-cantidad" value="1" min="1" max="10" readonly>
                    <button type="button" class="btn-cantidad" onclick="cambiarCantidad(1)">+</button>
                </div>

                <button class="btn-carrito" onclick="agregarAlCarrito()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Agregar al carrito</span>
                </button>
            </div>

            <div>
                <a href="catalogo.html" style="background: #666; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block;">Regresar al Catálogo</a>
            </div>
        </div>

        <div class="relacionados-seccion">
            <h3 class="relacionados-titulo">También te podría gustar...</h3>
            <div class="relacionados-grid" id="contenedor-relacionados"></div>
        </div>
    </main>

    <!-- Pie de página inyectado por componentes.js -->
    <footer></footer>

    <!-- Notificación Toast Dinámica -->
    <div id="toast" class="notificacion-toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-mensaje"></span>
    </div>

    <script>
        const productos = {
            'pozole': { img: 'img/pozole.jpg', titulo: 'Pozole Rojo', precio: 135.00, desc: 'Tradicional caldo con granos de maíz cacahuazintle y carne de cerdo, acompañado de lechuga, rábanos y su toque de orégano.' },
            'sopes': { img: 'img/Sopes.jpg', titulo: 'Sopes Tradicionales', precio: 95.00, desc: 'Tres piezas de masa de maíz hechas a mano con base de frijoles refritos, carne a elegir, lechuga, crema y queso fresco.' },
            'tacos': { img: 'img/tacos.jpg', titulo: 'Tacos al Pastor', precio: 120.00, desc: 'Orden de 5 deliciosos tacos de carne de cerdo marinada al pastor con su clásica piña, cebolla, cilantro y tortillas recién hechas.' },
            'tamales': { img: 'img/tamales.jpg', titulo: 'Tamales Caseros', precio: 85.00, desc: 'Par de suaves tamales envueltos en hoja de maíz, rellenos de jugosa salsa verde con pollo o mole rojo tradicional.' },
            'enchiladas': { img: 'img/enchiladas.png', titulo: 'Enchiladas Verdes', precio: 115.00, desc: 'Cuatro tortillas dobladas rellenas de pollo deshebrado, bañadas en salsa verde bien sazonada, crema, queso y cebolla.' },
            'nogada': { img: 'img/nogada.jpg', titulo: 'Chiles en Nogada', precio: 180.00, desc: 'Exquisito chile poblano relleno de picadillo de carne con frutas selectas, bañado en nuestra famosa crema de nuez de castilla y granada.' },
            'flautas': { img: 'img/flautas.jpg', titulo: 'Flautas de Pollo', precio: 90.00, desc: 'Tres tacos dorados y crujientes rellenos de pechuga de pollo, cubiertos con abundante lechuga, jitomate, crema y queso cotija.' },
            'quesadillas': { img: 'img/quesadillas.jpg', titulo: 'Quesadillas de Flor de Calabaza', precio: 75.00, desc: 'Tres quesadillas de comal rellenas de queso Oaxaca derretido y flor de calabaza sazonada con epazote.' },
            'horchata': { img: 'img/horchata.jpg', titulo: 'Agua de horchata', precio: 15.00, desc: 'Deliciosa y cremosa agua de horchata hecha de arroz, canela y leche.' }
        };

        const p = window.location.hash.substring(1); 
        
        if (productos[p]) {
            document.getElementById('img-prod').src = productos[p].img;
            document.getElementById('titulo-prod').innerText = productos[p].titulo;
            document.getElementById('precio-prod').innerText = `$${productos[p].precio.toFixed(2)}`;
            document.getElementById('desc-prod').innerText = productos[p].desc;

            const contenedorRelacionados = document.getElementById('contenedor-relacionados');
            let contador = 0;

            for (const llave in productos) {
                if (llave !== p && contador < 3) {
                    const prodRel = productos[llave];
                    const tarjetaHTML = `
                        <a href="detalle.html#${llave}" class="tarjeta-relacionado" onclick="setTimeout(()=>location.reload(), 50)">
                            <img src="${prodRel.img}" alt="${prodRel.titulo}">
                            <div class="tarjeta-relacionado-info">
                                <h4>${prodRel.titulo}</h4>
                                <p>$${prodRel.precio.toFixed(2)}</p>
                            </div>
                        </a>
                    `;
                    contenedorRelacionados.innerHTML += tarjetaHTML;
                    contador++;
                }
            }
        } else {
            document.getElementById('titulo-prod').innerText = "Producto no encontrado";
            document.getElementById('desc-prod').innerText = "Lo sentimos, el platillo seleccionado no está registrado en nuestro menú.";
            document.getElementById('precio-prod').innerText = "";
            document.querySelector('.img-detalle-contenedor').style.display = 'none';
            document.querySelector('.selector-cantidad').style.display = 'none';
            document.querySelector('.btn-carrito').style.display = 'none';
        }

        function cambiarCantidad(valor) {
            const input = document.getElementById('cantidad-prod');
            let cantidadActual = parseInt(input.value);
            cantidadActual += valor;

            if (cantidadActual >= 1 && cantidadActual <= 10) {
                input.value = cantidadActual;
            }
        }

        function agregarAlCarrito() {
            if (!productos[p]) return;

            const cantidad = parseInt(document.getElementById('cantidad-prod').value);
            let carrito = JSON.parse(localStorage.getItem('carritoApp')) || [];
            const existeIndex = carrito.findIndex(item => item.id === p);

            if (existeIndex !== -1) {
                carrito[existeIndex].cantidad += cantidad;
            } else {
                carrito.push({
                    id: p,
                    titulo: productos[p].titulo,
                    precio: productos[p].precio,
                    img: productos[p].img,
                    cantidad: cantidad
                });
            }

            localStorage.setItem('carritoApp', JSON.stringify(carrito));
            
            // Actualizar el contador visual usando la función global si existe
            if (window.actualizarContadorVisual) {
                window.actualizarContadorVisual();
            }

            // Mostrar notificación Toast
            const toast = document.getElementById('toast');
            const toastMensaje = document.getElementById('toast-mensaje');

            toastMensaje.innerText = `¡Éxito! Se han agregado ${cantidad}x "${productos[p].titulo}" al carrito.`;
            toast.classList.add('mostrar');

            setTimeout(() => {
                toast.classList.remove('mostrar');
            }, 3500);
        }
    </script>

</body>
</html>
