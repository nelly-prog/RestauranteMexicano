<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* ==========================================================================
           Estilos para controlar el tamaño de la imagen y diseño de la tarjeta
           ========================================================================== */
        
        .detalle-container {
            max-width: 600px; /* Limita el ancho de toda la tarjeta de detalle */
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* ¡SOLUCIÓN AL TAMAÑO GIGANTE DE LA IMAGEN! */
        .img-detalle-contenedor {
            width: 100%;
            max-width: 400px; /* Evita que la imagen crezca indefinidamente */
            height: 280px;    /* Altura fija y proporcional para la vista de detalle */
            margin: 0 auto 20px auto; /* Centra el contenedor y da espacio abajo */
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .img-detalle {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta la imagen sin deformarla ni estirarla */
        }

        .precio {
            font-size: 1.5rem;
            font-weight: bold;
            color: #b32525; /* Color rojo institucional */
            margin: 10px 0;
        }

        #titulo-prod {
            font-size: 1.8rem;
            color: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-contenedor">
        <img src="img/logo.png.png" class="logo-img" alt="Logo">
        <span>Sabor Mexicano</span>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="login.html">Iniciar Sesión</a></li>
            <li><a href="registro.html">Registrarse</a></li>
        </ul>
    </nav>
</header>

<main class="seccion">
    <div class="detalle-container" id="info-producto">
        <!-- Contenedor añadido para controlar las dimensiones físicas de la foto -->
        <div class="img-detalle-contenedor">
            <img id="img-prod" src="" class="img-detalle" alt="Producto">
        </div>
        
        <h1 id="titulo-prod">Cargando...</h1>
        <p id="precio-prod" class="precio"></p>
        <p id="desc-prod" style="margin-bottom: 20px; color: #555; font-size: 1.1rem; line-height: 1.5;"></p>
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            <a href="catalogo.html" class="btn-rojo" style="background: #666;">Regresar</a>
            <!-- Aquí el bloque 2 nos permitiría agregar lógica real -->
            <a href="login.html" class="btn-rojo">Agregar al carrito</a>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Sabor Mexicano - Todos los derechos reservados.</p>
    <p>e-business + e-commerce - Negocios Electrónicos I</p>
</footer>

<div class="redes-flotantes">
    <a href="https://facebook.com" target="_blank">
        <img src="img/face.png" alt="Facebook">
    </a>
    <a href="https://instagram.com" target="_blank">
        <img src="img/insta.jpg" alt="Instagram">
    </a>
</div>

<script>
    // Objeto actualizado con los 8 platillos en total
    const productos = {
        'pozole': { img: 'img/pozole.jpg', titulo: 'Pozole Rojo', precio: '$135.00', desc: 'Tradicional caldo con granos de maíz cacahuazintle y carne de cerdo, acompañado de lechuga, rábanos y su toque de orégano.' },
        'sopes': { img: 'img/Sopes.jpg', titulo: 'Sopes Tradicionales', precio: '$95.00', desc: 'Tres piezas de masa de maíz hechas a mano con base de frijoles refritos, carne a elegir, lechuga, crema y queso fresco.' },
        'tacos': { img: 'img/tacos.jpg', titulo: 'Tacos al Pastor', precio: '$120.00', desc: 'Orden de 5 deliciosos tacos de carne de cerdo marinada al pastor con su clásica piña, cebolla, cilantro y tortillas recién hechas.' },
        'tamales': { img: 'img/tamales.jpg', titulo: 'Tamales Caseros', precio: '$85.00', desc: 'Par de suaves tamales envueltos en hoja de maíz, rellenos de jugosa salsa verde con pollo o mole rojo tradicional.' },
        
        // NUEVOS PLATILLOS INTEGRADOS
        'enchiladas': { img: 'img/enchiladas.png', titulo: 'Enchiladas Verdes', precio: '$115.00', desc: 'Cuatro tortillas dobladas rellenas de pollo deshebrado, bañadas en salsa verde bien sazonada, crema, queso y cebolla.' },
        'nogada': { img: 'img/nogada.jpg', titulo: 'Chiles en Nogada', precio: '$180.00', desc: 'Exquisito chile poblano relleno de picadillo de carne con frutas selectas, bañado en nuestra famosa crema de nuez de castilla y granada.' },
        'flautas': { img: 'img/flautas.jpg', titulo: 'Flautas de Pollo', precio: '$90.00', desc: 'Tres tacos dorados y crujientes rellenos de pechuga de pollo, cubiertos con abundante lechuga, jitomate, crema y queso cotija.' },
        'quesadillas': { img: 'img/quesadillas.jpg', titulo: 'Quesadillas de Flor de Calabaza', precio: '$75.00', desc: 'Tres quesadillas de comal rellenas de queso Oaxaca derretido y flor de calabaza sazonada con epazote.' }
    };

    // Capturar el hash de la URL sin el símbolo '#'
    const p = window.location.hash.substring(1); 
    
    if (productos[p]) {
        document.getElementById('img-prod').src = productos[p].img;
        document.getElementById('titulo-prod').innerText = productos[p].titulo;
        document.getElementById('precio-prod').innerText = productos[p].precio;
        document.getElementById('desc-prod').innerText = productos[p].desc;
    } else {
        document.getElementById('titulo-prod').innerText = "Producto no encontrado";
        document.getElementById('desc-prod').innerText = "Lo sentimos, el platillo seleccionado no está registrado en nuestro menú.";
        document.getElementById('precio-prod').innerText = "";
        // Ocultar el contenedor de la imagen si no existe el producto
        document.querySelector('.img-detail-contenedor').style.display = 'none';
    }
</script>

</body>
</html>
