<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <div class="logo-contenedor">
        <img src="img/logo.png.png" class="logo-img" alt="Logo">
        <span>Sabor Mexicano</span>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="login.html">Iniciar Sesión</a></li>
        </ul>
    </nav>
</header>

<main class="seccion">
    <div class="detalle-container" id="info-producto">
        <img id="img-prod" src="" class="img-detalle" alt="Producto">
        <h1 id="titulo-prod">Cargando...</h1>
        <p id="precio-prod" class="precio"></p>
        <p id="desc-prod" style="margin-bottom: 20px; color: #555;"></p>
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            <a href="catalogo.html" class="btn-rojo" style="background: #666;">Regresar</a>
            <!-- Aquí el bloque 2 nos permitirá agregar lógica real -->
            <a href="login.html" class="btn-rojo">Agregar al carrito</a>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Sabor Mexicano - Todos los derechos reservados.</p>
    <p>e-business + e-commerce - Negocios Electrónicos I</p>
</footer>

<div class="redes-flotantes">
    <a href="https://facebook.com" target="_blank">
        <img src="img/face.png" alt="Facebook">
    </a>
    <a href="https://instagram.com" target="_blank">
        <img src="img/insta.jpg" alt="Instagram">
    </a>
</div>

<script>
    const productos = {
        'pozole': { img: 'img/pozole.jpg', titulo: 'Pozole Rojo', precio: '$135.00', desc: 'Tradicional caldo con granos de maíz y carne de cerdo.' },
        'sopes': { img: 'img/Sopes.jpg', titulo: 'Sopes', precio: '$95.00', desc: 'Masa de maíz hecha a mano con frijoles y carne.' },
        'tacos': { img: 'img/tacos.jpg', titulo: 'Tacos al Pastor', precio: '$120.00', desc: 'Carne marinada con piña, cebolla y cilantro.' },
        'tamales': { img: 'img/tamales.jpg', titulo: 'Tamales', precio: '$85.00', desc: 'Suaves tamales rellenos de salsa verde o roja.' }
    };

    const p = window.location.hash.substring(1); 
    if (productos[p]) {
        document.getElementById('img-prod').src = productos[p].img;
        document.getElementById('titulo-prod').innerText = productos[p].titulo;
        document.getElementById('precio-prod').innerText = productos[p].precio;
        document.getElementById('desc-prod').innerText = productos[p].desc;
    } else {
        document.getElementById('titulo-prod').innerText = "Producto no encontrado";
    }
</script>

</body>
</html>
