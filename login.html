<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="componentes.js" defer></script>
    <style>
        /* Estructura para fijar el footer al fondo */
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; }
        main { flex: 1 0 auto; padding: 40px 20px; display: flex; align-items: center; justify-content: center; }
        footer { flex-shrink: 0; }

        /* Tarjeta de Login */
        .contenedor-tarjeta {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #006847;
        }
        
        .contenedor-tarjeta h2 { color: #006847; text-align: center; margin-bottom: 20px; }

        .campo-form { margin-bottom: 15px; }
        .campo-form label { display: block; font-weight: bold; color: #005F73; margin-bottom: 5px; }
        .campo-form input { 
            width: 100%; padding: 12px; border: 1px solid #ccc; 
            border-radius: 8px; box-sizing: border-box; 
        }

        .btn-entrar { 
            background: #b71c1c; color: white; width: 100%; padding: 12px; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .btn-entrar:hover { background: #9c1818; }

        /* Estilo para los modales personalizados */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 2000;
        }
    </style>
</head>
<body>

    <div id="banner-global"></div>
    <header></header>

    <main>
        <div class="contenedor-tarjeta">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <div class="campo-form">
                    <label>Correo:</label>
                    <input type="email" id="loginEmail" required placeholder="tu@correo.com">
                </div>
                <div class="campo-form">
                    <label>Contraseña:</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>

                <div style="margin: 15px 0; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="recordarSesion" style="width: auto; margin: 0;">
                    <label for="recordarSesion" style="margin: 0; font-size: 0.9rem; font-weight: normal; color: #555;">Recordar mis datos</label>
                </div>

                <button type="submit" class="btn-entrar">Entrar</button>

                <div style="margin-top: 20px; text-align: center;">
                    <a href="#" onclick="abrirModal('modal-recuperacion')" style="color: #2140dd; text-decoration: none; font-size: 0.9rem;">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                    ¿No tienes cuenta? <a href="registro.html" style="color: #006847; font-weight: bold; text-decoration: none;">Regístrate</a>
                </p>
            </form>
        </div>
    </main>

    <footer></footer>

    <!-- Modal 1: Recuperar acceso -->
    <div id="modal-recuperacion" class="modal-overlay">
        <div class="contenedor-tarjeta" style="max-width: 350px;">
            <h3 style="color:#006847; margin-top:0;">Recuperar acceso</h3>
            <p>Ingresa tu correo o teléfono:</p>
            <input type="text" id="input-recuperacion" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;">
            <div style="display:flex; gap:10px;">
                <button class="btn-entrar" onclick="cerrarModal('modal-recuperacion')" style="background:#666;">Cancelar</button>
                <button class="btn-entrar" onclick="enviarRecuperacion()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Confirmación de envío -->
    <div id="modal-confirmacion" class="modal-overlay">
        <div class="contenedor-tarjeta" style="max-width: 300px; text-align: center;">
            <h3 style="color:#006847;">¡Enviado!</h3>
            <p>Se ha enviado una liga de recuperación a tu cuenta.</p>
            <button class="btn-entrar" onclick="cerrarModal('modal-confirmacion')">Aceptar</button>
        </div>
    </div>

    <script>
        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

        function enviarRecuperacion() {
            const dato = document.getElementById('input-recuperacion').value;
            if (dato) {
                cerrarModal('modal-recuperacion');
                abrirModal('modal-confirmacion');
            }
        }

        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const recordar = document.getElementById('recordarSesion').checked;
            
            localStorage.setItem('usuario_activo', email.split('@')[0]);
            localStorage.setItem('recordar_sesion', recordar);
            localStorage.setItem('sesionIniciada', 'true');
            
            window.location.href = "perfil.html";
        });
    </script>
</body>
</html>
