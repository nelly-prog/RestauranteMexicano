<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Sabor Mexicano</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* Estilos rápidos para el perfil */
        .perfil-card { border: 1px solid #ddd; padding: 30px; border-radius: 12px; max-width: 600px; margin: 40px auto; background: #fff; text-align: center; }
        .info-usuario { font-size: 1.2rem; color: #333; margin-top: 10px; }
        .seccion-datos { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <header>
        <div class="logo-contenedor">
            <img src="img/logo.png.png" class="logo-img" alt="Logo">
            <span style="font-size: 1.5rem; font-weight: bold;">Sabor Mexicano</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="login.html" onclick="cerrarSesion()">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="seccion">
        <div class="perfil-card">
            <h2 id="titulo-perfil">Bienvenido a tu perfil</h2>
            <p class="info-usuario">Hola, <span id="nombre-usuario-display">invitado</span>.</p>
            <p style="color: #666;">Aquí podrás gestionar tus datos y ver tus pedidos en el futuro.</p>
            
            <div class="seccion-datos">
                <h3>Mis datos</h3>
                <p>Correo registrado: <span id="email-usuario-display">No disponible</span></p>
            </div>

            <a href="index.html" class="btn-rojo" style="display: inline-block; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; color: white; background-color: #d9534f;">Regresar al Inicio</a>
        </div>
    </main>

    <script>
        // 1. Recuperar los datos del localStorage
        const nombre = localStorage.getItem('usuarioNombre');
        const email = localStorage.getItem('usuarioEmail');
        
        // 2. Actualizar el DOM
        const titulo = document.getElementById('titulo-perfil');
        const spanNombre = document.getElementById('nombre-usuario-display');
        const spanEmail = document.getElementById('email-usuario-display');
        
        if (nombre) {
            titulo.innerText = "¡Bienvenido de nuevo, " + nombre + "!";
            spanNombre.innerText = nombre;
        }
        
        if (email) {
            spanEmail.innerText = email;
        }

        // 3. Función simple para cerrar sesión
        function cerrarSesion() {
            localStorage.removeItem('usuarioNombre');
            localStorage.removeItem('usuarioEmail');
            alert("Has cerrado sesión correctamente.");
        }
    </script>
</body>
</html>
